name: rule-data-in-sync
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: rule-data-in-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rule-data-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Regenerate RuleData.lean from pinned phino and detect drift
        run: |
          bash scripts/regen-rule-data.sh
          if ! git diff --exit-code PhiConfluence/RuleData.lean; then
            echo "::error::PhiConfluence/RuleData.lean is out of sync with phino — run scripts/regen-rule-data.sh and commit"
            exit 1
          fi
