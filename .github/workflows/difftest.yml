name: difftest
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: difftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  difftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: objectionary/phino@9f7992914b2aff1ec7d0b28d37066e43b9dfeeba  # master
        with:
          version-file: .phino-version
      - uses: ./.github/actions/setup-lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Differential test — our reducer vs phino
        run: |
          pip install -r .github/requirements.txt
          make difftest
