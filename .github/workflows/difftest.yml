name: difftest
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: difftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  difftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install phino (pinned via .phino-version, verified via .phino-sha256)
        run: |
          version="$(cat .phino-version)"
          curl -fsSL -o phino "http://phino.objectionary.com/releases/ubuntu-24.04/phino-$version"
          echo "$(cat .phino-sha256)  phino" | sha256sum --check --strict
          sudo install -m 755 phino /usr/local/bin/phino
          rm phino
          phino --version
      - uses: ./.github/actions/setup-lean
      - name: Differential test — our reducer vs phino
        run: bash scripts/difftest.sh
