---
# yamllint disable rule:line-length
name: yamllint
'on':
  push:
    branches:
      - master
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
  pull_request:
    branches:
      - master
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
jobs:
  yamllint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
