name: rules-in-sync
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: rules-in-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Regenerate rules from phino (latest) and detect drift
        run: |
          bash scripts/regen-rules.sh
          if ! git diff --exit-code PhiConfluence/Rules.lean; then
            echo "::error::PhiConfluence/Rules.lean is out of sync with phino — run scripts/regen-rules.sh and commit"
            exit 1
          fi
