---
name: ruff
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruff:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.4'
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.4'
          args: 'format --check --diff'
