---
name: ruff
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  ruff:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.8'
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.8'
          args: 'format --check --diff'
